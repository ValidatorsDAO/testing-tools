[package]
name = "geyserbench"
version = "2.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Benchmark Solana gRPC data feeds with region-aware latency analysis"
repository = "https://github.com/elsoul/geyserbench-rs"

[dependencies]
tokio-stream = "0.1.17"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-native-roots"] }
tonic-prost = "0.14"
futures = "0.3.31"
futures-util = "0.3.31"
bs58 = "0.5.1"
bytes = "1.10.0"
bincode = "1.3.3"
solana-entry = "2"
solana-pubkey = "2"
lazy_static = "1.5.0"
dashmap = "6"
comfy-table = "7.1.0"
anyhow = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
